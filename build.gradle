plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    runs {
        // Headless regression checks (board/box/api - see board.SelfTest), same gating pattern
        // as the neoforge/1.21.1 and forge/1.20.1 branches' `runSelfTest` task.
        selfTest {
            server()
            name 'Self Test'
            vmArgs('-Dfarmerscontracts.selftest=true')
        }
        // Economy balance-tuning dump (see contract.BalanceCheck).
        balance {
            server()
            name 'Balance Check'
            vmArgs('-Dfarmerscontracts.balance=true')
        }
    }
}

repositories {
    maven {
        // Parchment mappings
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // Farmer's Delight Refabricated
        name = "Cassian's Maven"
        url = 'https://maven.cassian.cc'
    }
    maven {
        // Porting Lib (FarmersDelightRefabricated 1.20.1 transitive dependency)
        url = 'https://mvn.devos.one/releases/'
    }
    maven {
        // Reach Entity Attributes (Porting Lib transitive dependency)
        url = 'https://maven.jamieswhiteshirt.com/libs-release'
    }
    exclusiveContent {
        forRepository {
            maven {
                // Fabric-ASM (Porting Lib transitive dependency)
                url = 'https://jitpack.io'
            }
        }
        filter {
            includeGroup 'com.github.Chocohead'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }
}

processResources {
    def replaceProperties = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_license    : mod_license,
            mod_version    : mod_version,
            mod_authors    : mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
