org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft version this Fabric build targets.
minecraft_version=1.20.1
# Mappings: official Mojang mappings (matches the naming already used by the neoforge/1.21.1 and
# forge/1.20.1 sources) layered with Parchment for readable parameter names.
parchment_version=1.20.1:2023.09.03

fabric_loader_version=0.18.2
fabric_api_version=0.92.11+1.20.1

# Farmer's Delight Refabricated (community Fabric port, maintains the vectorwing.farmersdelight
# package/mod id so FarmersDelightCompat.java and all data-driven contract pool references to
# farmersdelight: item/tag IDs port unchanged) - see https://maven.cassian.cc.
fdrf_version=1.20.1-2.5.5+refabricated

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=farmerscontracts
# The human-readable display name for the mod.
mod_name=Farmer's Delight: Contracts & Feasts
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.5
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=dev.flomik
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Flomik
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Adds a Contract Board economy to Farmer's Delight: fulfill orders from village customers using its recipes for emeralds, XP and rare rewards.
